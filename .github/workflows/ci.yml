name: CI

# Runs on every branch push. A pull_request trigger is deliberately omitted: for
# same-repo branches it would only duplicate the push run on the identical SHA,
# and the push run already reports on the PR.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: solutions/user-management-api

jobs:
  build-test:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: solutions/user-management-api/go.mod
          cache-dependency-path: solutions/user-management-api/go.sum

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go build ./...

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: solutions/user-management-api/coverage.out

      # Uploaded under a flag so the unit and integration profiles stay
      # distinguishable on Codecov. Generated and wiring-only packages are
      # excluded in codecov.yml, otherwise the total would understate the code
      # that is actually tested.
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          files: solutions/user-management-api/coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: solutions/user-management-api/go.mod
          cache-dependency-path: solutions/user-management-api/go.sum

      # Pinned to the version this repo was linted clean with; the action also
      # validates .golangci.yml (version: "2" schema) before running.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          working-directory: solutions/user-management-api

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: solutions/user-management-api/go.mod
          cache-dependency-path: solutions/user-management-api/go.sum

      # ubuntu-latest ships a running Docker daemon, which testcontainers needs
      # to start the mongo:7 container these tests talk to. The mongodb adapter
      # has no unit tests by design, so its coverage only exists here: without
      # this profile the reported total would penalise a package that is in
      # fact exercised, against a real database.
      - name: integration tests
        run: go test -tags=integration -race -timeout=10m -coverprofile=coverage-integration.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: solutions/user-management-api/coverage-integration.out

      - name: upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          files: solutions/user-management-api/coverage-integration.out
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: solutions/user-management-api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
